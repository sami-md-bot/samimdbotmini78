    <style>
        :root {
            --primary: #00e676;
            --primary-glow: rgba(0, 230, 118, 0.4);
            --bg: #050505;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #888888;
            --secondary: #3b82f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            background: var(--glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Header */
        .header { text-align: center; margin-bottom: 25px; }
        .logo-box {
            width: 90px; height: 90px; margin: 0 auto 15px;
            border-radius: 50%; overflow: hidden;
            border: 3px solid var(--primary);
            box-shadow: 0 0 25px var(--primary-glow);
        }
        .logo-box img { width: 100%; height: 100%; object-fit: cover; }
        
        h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 5px; }
        .owner-tag { font-size: 0.8rem; color: var(--text-muted); display: block; margin-bottom: 15px; }
        
        .join-btn {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(59, 130, 246, 0.1); color: var(--secondary);
            padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: 600;
            text-decoration: none; transition: 0.3s; border: 1px solid rgba(59, 130, 246, 0.2);
        }
        .join-btn:hover { background: var(--secondary); color: white; }

        /* Status & Stats */
        .status-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.03); padding: 10px 15px;
            border-radius: 12px; margin-bottom: 25px; font-size: 0.75rem;
        }
        .status-indicator { display: flex; align-items: center; gap: 6px; font-weight: 700; }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
        .dot.online { background: var(--primary); box-shadow: 0 0 8px var(--primary); }
        .dot.offline { background: #ef4444; }

        /* Form */
        .input-group { position: relative; margin-bottom: 20px; }
        .input-wrapper { display: flex; gap: 10px; }
        
        input {
            width: 100%; background: #111; border: 1px solid var(--border);
            padding: 14px; border-radius: 12px; color: white; font-size: 0.95rem;
            outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0, 230, 118, 0.1); }
        
        .country-code { width: 65px; text-align: center; }

        .action-btn {
            width: 100%; background: var(--primary); color: #000; border: none;
            padding: 15px; border-radius: 12px; font-weight: 700; font-size: 1rem;
            cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .action-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0, 230, 118, 0.2); }
        .action-btn:active { transform: translateY(0); }

        /* Result */
        .result-area { margin-top: 25px; text-align: center; display: none; }
        .code-display {
            font-family: 'Courier New', monospace; font-size: 2rem; font-weight: 800;
            letter-spacing: 2px; color: var(--primary); background: rgba(0, 230, 118, 0.1);
            padding: 12px; border-radius: 12px; border: 1px dashed var(--primary);
            margin: 10px 0; display: inline-block; width: 100%;
        }
        .timer { font-size: 0.85rem; color: var(--text-muted); }

        /* Loader */
        .spinner {
            width: 20px; height: 20px; border: 2px solid #000; border-top-color: transparent;
            border-radius: 50%; animation: spin 1s linear infinite; display: none;
        }

        /* Animations */
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
